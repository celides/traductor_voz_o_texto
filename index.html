<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>VoxFlow</title>
<style>
:root{--bg:#14161c;--panel:#1d2028;--line:#2e323d;--tx:#ece8df;--mu:#8f94a3;--ok:#6cc4ae;--rec:#e5645a}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);
font:16px/1.4 system-ui,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
select,label.sw{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
label.sw{display:flex;align-items:center;gap:6px}
#log{flex:1;overflow-y:auto;padding:14px 14px 4px}
.it{margin:0 0 18px;max-width:34em}
.zh{font-size:clamp(24px,7vw,34px);line-height:1.45;letter-spacing:.02em}
.es{font-size:13px;color:var(--mu);margin-top:4px}
#live{min-height:22px;padding:0 14px;font-size:14px;color:var(--mu);font-style:italic}
#msg{padding:0 14px;font-size:14px;color:var(--rec)}
.foot{display:flex;justify-content:center;padding:10px 0 14px}
#mic{min-width:200px;height:68px;border-radius:34px;border:0;font-size:18px;font-weight:600;color:#10231f;background:var(--ok);cursor:pointer}
#mic.on{background:var(--rec);color:#2a0f0c}
#mic:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="bar">
  <select id="ui" aria-label="UI"><option value="es">Español</option><option value="en">English</option><option value="zh">中文</option></select>
  <select id="var" aria-label="Chinese"><option value="zh-Hans">简体</option><option value="zh-Hant">繁體</option></select>
  <select id="eng" aria-label="Engine"><option value="azure">Azure</option><option value="gemini">Gemini</option></select>
  <label class="sw"><input type="checkbox" id="aud"><span data-t="audio"></span></label>
</div>
<div id="log" aria-live="polite"></div>
<div id="live"></div>
<div id="msg"></div>
<div class="foot"><button id="mic"></button></div>

<script>
const T={
 es:{start:'Escuchar',stop:'Detener',audio:'Audio',hear:'Escuchando…',unsup:'Este navegador no reconoce voz. Abre la página en Chrome.',deny:'Permiso de micrófono denegado. Actívalo en los ajustes del navegador.',err:'No se pudo traducir',tr:'Traduciendo…'},
 en:{start:'Listen',stop:'Stop',audio:'Audio',hear:'Listening…',unsup:'This browser has no speech recognition. Open the page in Chrome.',deny:'Microphone permission denied. Enable it in browser settings.',err:'Translation failed',tr:'Translating…'},
 zh:{start:'开始聆听',stop:'停止',audio:'语音',hear:'正在聆听…',unsup:'此浏览器不支持语音识别，请用 Chrome 打开。',deny:'麦克风权限被拒绝，请在浏览器设置中开启。',err:'翻译失败',tr:'翻译中…'}
};
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const t=k=>T[$('ui').value][k];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,lock=null,pending=0;

// Ajustes guardados; el idioma de interfaz sigue al del teléfono la primera vez
const sys=(navigator.language||'es').slice(0,2);
$('ui').value=store.get('ui')||(T[sys]?sys:'es');
['var','eng'].forEach(k=>{const v=store.get(k);if(v)$(k).value=v});
$('aud').checked=store.get('aud')==='1';

function paint(){
 document.documentElement.lang=$('ui').value;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $('mic').textContent=on?t('stop'):t('start');
 $('mic').classList.toggle('on',on);
 if(!on)$('live').textContent='';
}
['ui','var','eng'].forEach(k=>$(k).onchange=()=>{store.set(k,$(k).value);paint()});
$('aud').onchange=()=>{store.set('aud',$('aud').checked?'1':'0');if(!$('aud').checked)speechSynthesis.cancel()};

function add(es){
 const d=document.createElement('div');d.className='it';
 d.innerHTML='<div class="zh"></div><div class="es"></div>';
 d.children[0].textContent='…';d.children[1].textContent=es;
 $('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;return d;
}

function speak(x){
 if(!$('aud').checked||!('speechSynthesis' in window))return;
 if(pending>2){speechSynthesis.cancel();pending=0} // si va atrasado, salta frases viejas
 const u=new SpeechSynthesisUtterance(x);
 u.lang=$('var').value==='zh-Hant'?'zh-TW':'zh-CN';u.rate=1.15;
 u.onend=u.onerror=()=>{pending=Math.max(0,pending-1)};
 pending++;speechSynthesis.speak(u);
}

async function translate(es){
 if(!es)return;
 const el=add(es);
 try{
  const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({text:es,target:$('var').value,engine:$('eng').value})});
  const d=await r.json();if(!r.ok||!d.text)throw 0;
  el.children[0].textContent=d.text;speak(d.text);
 }catch{el.children[0].textContent='⚠ '+t('err')}
 $('log').scrollTop=$('log').scrollHeight;
}

function setup(){
 rec=new SR();rec.lang='es-MX';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{
  let tmp='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const r=e.results[i];
   if(r.isFinal)translate(r[0].transcript.trim());else tmp+=r[0].transcript;
  }
  $('live').textContent=tmp;
 };
 rec.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;$('msg').textContent=t('deny');paint()}
 };
 // Chrome corta la escucha tras silencios: se reinicia sola mientras esté activa
 rec.onend=()=>{if(on)setTimeout(()=>{try{rec.start()}catch{}},250)};
}

async function toggle(){
 if(!SR){$('msg').textContent=t('unsup');return}
 $('msg').textContent='';
 if(!on){
  if(!rec)setup();
  on=true;try{rec.start()}catch{}
  try{lock=await navigator.wakeLock?.request('screen')}catch{} // pantalla encendida
  $('live').textContent=t('hear');
 }else{
  on=false;rec.stop();speechSynthesis.cancel();lock?.release?.();lock=null;
 }
 paint();
}
$('mic').onclick=toggle;
document.addEventListener('visibilitychange',async()=>{
 if(on&&document.visibilityState==='visible'){try{lock=await navigator.wakeLock?.request('screen')}catch{}}
});
paint();
if(!SR)$('msg').textContent=t('unsup');
</script>
</body>
</html>
