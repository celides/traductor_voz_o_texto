<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>VoxFlow</title>
<style>
:root{--bg:#14161c;--panel:#1d2028;--line:#2e323d;--tx:#ece8df;--mu:#8f94a3;--ok:#6cc4ae;--rec:#e5645a}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);
font:16px/1.4 system-ui,"Noto Sans","Noto Sans SC","Noto Sans Arabic","PingFang SC","Microsoft YaHei",sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;align-items:center}
.bar.top{border-bottom:1px solid var(--line)}
select,button.sq,label.sw{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.bar.top select{flex:1;min-width:0}
label.sw{display:flex;align-items:center;gap:6px}
#log{flex:1;overflow-y:auto;padding:14px 14px 4px}
.it{margin:0 0 18px;max-width:34em}
.tr{font-size:clamp(24px,7vw,34px);line-height:1.45}
.src{font-size:13px;color:var(--mu);margin-top:4px}
#live{min-height:22px;padding:0 14px;font-size:14px;color:var(--mu);font-style:italic}
#msg{padding:0 14px;font-size:14px;color:var(--rec)}
.foot{display:flex;justify-content:center;padding:10px 0 14px}
#mic{min-width:200px;height:68px;border-radius:34px;border:0;font-size:18px;font-weight:600;color:#10231f;background:var(--ok)}
#mic.on{background:var(--rec);color:#2a0f0c}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="bar top">
  <select id="from" aria-label="From"></select>
  <button class="sq" id="swap" aria-label="Swap">⇄</button>
  <select id="to" aria-label="To"></select>
</div>
<div class="bar">
  <select id="ui" aria-label="UI"><option value="es">Español</option><option value="en">English</option><option value="zh">中文</option></select>
  <select id="eng" aria-label="Engine"><option value="azure">Azure</option><option value="gemini">Gemini</option></select>
  <select id="ctx" aria-label="Context"><option value="general"></option><option value="church"></option></select>
  <label class="sw"><input type="checkbox" id="aud"><span data-t="audio"></span></label>
</div>
<div id="log" aria-live="polite"></div>
<div id="live" dir="auto"></div>
<div id="msg"></div>
<div class="foot"><button id="mic"></button></div>

<script>
// [código de traducción, nombre en su idioma, código de voz]
const L=[['es','Español','es-MX'],['en','English','en-US'],['zh-Hans','简体中文','zh-CN'],['zh-Hant','繁體中文','zh-TW'],['ar','العربية','ar-AE'],['fr','Français','fr-FR'],['de','Deutsch','de-DE'],['it','Italiano','it-IT'],['pt','Português','pt-BR'],['ru','Русский','ru-RU'],['ja','日本語','ja-JP'],['ko','한국어','ko-KR'],['hi','हिन्दी','hi-IN'],['ur','اردو','ur-PK'],['fil','Filipino','fil-PH'],['tr','Türkçe','tr-TR'],['nl','Nederlands','nl-NL'],['pl','Polski','pl-PL'],['uk','Українська','uk-UA'],['vi','Tiếng Việt','vi-VN'],['th','ไทย','th-TH'],['id','Indonesia','id-ID'],['he','עברית','he-IL'],['fa','فارسی','fa-IR']];
const T={
 es:{start:'Escuchar',stop:'Detener',audio:'Audio',hear:'Escuchando…',unsup:'Este navegador no reconoce voz. Abre la página en Chrome.',deny:'Permiso de micrófono denegado. Actívalo en los ajustes del navegador.',err:'No se pudo traducir',g:'General',c:'Iglesia'},
 en:{start:'Listen',stop:'Stop',audio:'Audio',hear:'Listening…',unsup:'This browser has no speech recognition. Open the page in Chrome.',deny:'Microphone permission denied. Enable it in browser settings.',err:'Translation failed',g:'General',c:'Church'},
 zh:{start:'开始聆听',stop:'停止',audio:'语音',hear:'正在聆听…',unsup:'此浏览器不支持语音识别，请用 Chrome 打开。',deny:'麦克风权限被拒绝，请在浏览器设置中开启。',err:'翻译失败',g:'通用',c:'教会'}
};
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const t=k=>T[$('ui').value][k];
const lang=id=>L.find(l=>l[0]===id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,lock=null,pending=0,cur='',timer=null,ignore=false;

L.forEach(l=>{$('from').add(new Option(l[1],l[0]));$('to').add(new Option(l[1],l[0]))});
const sys=(navigator.language||'es').slice(0,2);
$('ui').value=store.get('ui')||(T[sys]?sys:'es');
$('from').value=store.get('from')||'es';
$('to').value=store.get('to')||'zh-Hans';
['eng','ctx'].forEach(k=>{const v=store.get(k);if(v)$(k).value=v});
$('aud').checked=store.get('aud')==='1';

function paint(){
 document.documentElement.lang=$('ui').value;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $('ctx').options[0].text=t('g');$('ctx').options[1].text=t('c');
 $('mic').textContent=on?t('stop'):t('start');
 $('mic').classList.toggle('on',on);
}
['ui','from','to','eng','ctx'].forEach(k=>$(k).onchange=()=>{store.set(k,$(k).value);paint();if(k==='from'&&on)commit()});
$('swap').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;store.set('from',$('from').value);store.set('to',$('to').value);if(on)commit()};
$('aud').onchange=()=>{store.set('aud',$('aud').checked?'1':'0');if(!$('aud').checked)speechSynthesis.cancel()};

function add(src){
 const d=document.createElement('div');d.className='it';
 d.innerHTML='<div class="tr" dir="auto">…</div><div class="src" dir="auto"></div>';
 d.children[1].textContent=src;$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;return d;
}
function speak(x,to){
 if(!$('aud').checked||!('speechSynthesis' in window))return;
 if(pending>2){speechSynthesis.cancel();pending=0}
 const u=new SpeechSynthesisUtterance(x);u.lang=lang(to)[2];u.rate=1.1;
 u.onend=u.onerror=()=>{pending=Math.max(0,pending-1)};
 pending++;speechSynthesis.speak(u);
}
async function translate(x){
 const from=$('from').value,to=$('to').value,el=add(x);
 try{
  const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({text:x,from,to,engine:$('eng').value,ctx:$('ctx').value})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.text){el.children[0].textContent='⚠ '+t('err');el.children[1].textContent=x+'  ['+(d.error||r.status)+(d.detail?': '+d.detail:'')+']';return}
  el.children[0].textContent=d.text;speak(d.text,to);
 }catch{el.children[0].textContent='⚠ '+t('err')}
 $('log').scrollTop=$('log').scrollHeight;
}

// Android entrega resultados acumulados ("Hola", "Hola qué", "Hola qué tal"): se unifican y se traduce una sola vez tras una pausa
function collect(e){
 const s=[];for(let i=0;i<e.results.length;i++)s.push(e.results[i][0].transcript.trim());
 return s.filter((x,i)=>!(i+1<s.length&&s[i+1].startsWith(x))).join(' ').trim();
}
function commit(){
 clearTimeout(timer);const x=cur;cur='';ignore=true;$('live').textContent='';
 if(x)translate(x);
 try{rec.stop()}catch{}
}
function begin(){rec.lang=lang($('from').value)[2];ignore=false;try{rec.start()}catch{}}
function setup(){
 rec=new SR();rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{
  if(ignore)return;
  cur=collect(e);$('live').textContent=cur;
  clearTimeout(timer);timer=setTimeout(commit,1100);
  if(cur.length>180)commit();
 };
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;$('msg').textContent=t('deny');paint()}};
 rec.onend=()=>{if(on)setTimeout(begin,150)};
}
async function toggle(){
 if(!SR){$('msg').textContent=t('unsup');return}
 $('msg').textContent='';
 if(!on){
  if(!rec)setup();
  on=true;begin();
  try{lock=await navigator.wakeLock?.request('screen')}catch{}
  $('live').textContent=t('hear');
 }else{
  on=false;clearTimeout(timer);try{rec.stop()}catch{}speechSynthesis.cancel();lock?.release?.();lock=null;$('live').textContent='';
 }
 paint();
}
$('mic').onclick=toggle;
document.addEventListener('visibilitychange',async()=>{if(on&&document.visibilityState==='visible'){try{lock=await navigator.wakeLock?.request('screen')}catch{}}});
paint();
if(!SR)$('msg').textContent=t('unsup');
</script>
</body>
</html>
